vfs:
  login_url: "https://visa.vfsglobal.com/srb/en/hrv/login"
  appointment_url: "https://visa.vfsglobal.com/srb/en/hrv/book-appointment"
  application_centre: "Visa Application Centre,Belgrade"
  # Keywords for dropdown matching (case-insensitive substring).
  # If omitted, defaults to the full value above (lowercased).
  centre_keyword: "belgrade"
  category: "C visa"
  category_keyword: "c visa"
  sub_category: "Tourist, Visit , Business"
  sub_category_keyword: "tourist"
  # Cautious cadence for a residential/mobile proxy: a random 30-40 min gap
  # between checks. Slow enough to avoid VFS rate-limit blocks. If the bot
  # starts hitting blocks repeatedly, it automatically backs off further
  # (see main.py).
  poll_interval_min_seconds: 1800
  poll_interval_max_seconds: 2400
  # If > 0, repeat the Telegram notification every N seconds while the slot
  # remains available (in addition to the first one). 0 = notify only once
  # per appearance.
  reminder_interval_seconds: 0
  # How long (seconds) to pause after VFS hard-blocks with "Access Denied /
  # 429002 Unauthorised Activity". This is a rate-limit/anti-bot block;
  # retrying quickly only makes it last longer, so back off (default 30 min).
  access_denied_backoff_seconds: 7500
  headless: false
  storage_state_path: "storage_state.json"
  # Save a screenshot at each login step (login page, credentials filled,
  # Cloudflare passed, OTP page, OTP entered, success/failure) into debug_dir
  # and send the success/failure shot to Telegram. Useful to see what the
  # bot is doing when running headless/without a GUI.
  debug_screenshots: true
  debug_dir: "debug"

imap:
  host: "imap.gmail.com"
  port: 993
  folder: "INBOX"
  # VFS sends the OTP from donotreply@vfshelpline.com (not vfsglobal.com).
  sender_filter: "vfshelpline.com"
  otp_regex: '\b(\d{4,8})\b'
  poll_timeout_seconds: 120
  poll_interval_seconds: 5

# Optional: multiple VFS accounts. When one gets blocked (Access Denied /
# Account Locked / Access Restricted), the bot automatically switches to the
# next available account and parks the blocked one until its cooldown expires.
# Each account keeps its own cookie file (storage_state_<label>.json).
# If omitted, the bot uses the single VFS_EMAIL/VFS_PASSWORD from .env.
#
# imap_username/imap_password are the mailbox that receives THAT account's OTP.
# Leave them out to reuse the global imap settings above (only works if all
# accounts share one mailbox).
#
# accounts:
#   - vfs_email: "first@example.com"
#     vfs_password: "password1"
#     imap_username: "first@gmail.com"
#     imap_password: "app_password1"
#     label: "primary"
#   - vfs_email: "second@example.com"
#     vfs_password: "password2"
#     imap_username: "second@gmail.com"
#     imap_password: "app_password2"
#     label: "backup"

telegram: {}

# Optional. Strongly recommended to use a residential proxy — Cloudflare
# usually blocks VFS access from datacenter IPs. Leave server empty to run
# without a proxy. Credentials can also be set via PROXY_USERNAME/PROXY_PASSWORD
# in .env instead of putting them here.
proxy:
  server: ""   # e.g. "http://1.2.3.4:8080" or "socks5://1.2.3.4:1080"
