<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: Schengen/EU blue circle -->
  <circle cx="256" cy="256" r="256" fill="#003399"/>

  <!-- Ring of EU stars -->
  <g fill="#FFCC00">
    <g id="star-template">
      <path id="star" d="M0,-14 L3.3,-4.3 L13.3,-4.3 L5,1.6 L8.2,11.3 L0,5.4 L-8.2,11.3 L-5,1.6 L-13.3,-4.3 L-3.3,-4.3 Z"/>
    </g>
    <use href="#star" transform="translate(256,46)"/>
    <use href="#star" transform="translate(256,466)"/>
    <use href="#star" transform="translate(46,256)"/>
    <use href="#star" transform="translate(466,256)"/>
    <use href="#star" transform="translate(317,61) rotate(30)"/>
    <use href="#star" transform="translate(386,90) rotate(60)"/>
    <use href="#star" transform="translate(422,126) rotate(90)"/>
    <use href="#star" transform="translate(451,195) rotate(120)"/>
    <use href="#star" transform="translate(451,317) rotate(60)"/>
    <use href="#star" transform="translate(422,386) rotate(90)"/>
    <use href="#star" transform="translate(386,422) rotate(120)"/>
    <use href="#star" transform="translate(317,451) rotate(150)"/>
    <use href="#star" transform="translate(195,451) rotate(30)"/>
    <use href="#star" transform="translate(126,422) rotate(60)"/>
    <use href="#star" transform="translate(90,386) rotate(90)"/>
    <use href="#star" transform="translate(61,317) rotate(120)"/>
    <use href="#star" transform="translate(61,195) rotate(60)"/>
    <use href="#star" transform="translate(90,126) rotate(30)"/>
    <use href="#star" transform="translate(126,90) rotate(60)"/>
    <use href="#star" transform="translate(195,61) rotate(30)"/>
  </g>

  <!-- Passport / document -->
  <g transform="translate(256,266)">
    <rect x="-95" y="-115" width="190" height="230" rx="14" fill="#FFFFFF"/>
    <rect x="-95" y="-115" width="190" height="230" rx="14" fill="none" stroke="#003399" stroke-width="6"/>

    <!-- Page lines -->
    <rect x="-65" y="-30" width="130" height="10" rx="5" fill="#C9D6EE"/>
    <rect x="-65" y="-5" width="130" height="10" rx="5" fill="#C9D6EE"/>
    <rect x="-65" y="20" width="80" height="10" rx="5" fill="#C9D6EE"/>

    <!-- Emblem circle (passport crest) -->
    <circle cx="0" cy="-75" r="28" fill="#003399"/>
    <g fill="#FFCC00">
      <use href="#star" transform="translate(0,-93) scale(0.6)"/>
      <use href="#star" transform="translate(15,-86) scale(0.6) rotate(72)"/>
      <use href="#star" transform="translate(15,-65) scale(0.6) rotate(144)"/>
      <use href="#star" transform="translate(-15,-65) scale(0.6) rotate(216)"/>
      <use href="#star" transform="translate(-15,-86) scale(0.6) rotate(288)"/>
    </g>
  </g>

  <!-- Notification bell badge -->
  <g transform="translate(372,372)">
    <circle cx="0" cy="0" r="64" fill="#FF4D4D" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M0,-24 C-15,-24 -24,-13 -24,2 L-24,16 L-32,28 L32,28 L24,16 L24,2 C24,-13 15,-24 0,-24 Z"
          fill="#FFFFFF"/>
    <path d="M-9,32 a9,9 0 0 0 18,0 Z" fill="#FFFFFF"/>
  </g>
</svg>
